services:
  server:
    build:
      context: ./source
      dockerfile: deploy/Dockerfile.server.prebuild
    environment:
      MANAGEMENT_PORT: 18080
      TUNNEL_PORT_START: ${TUNNEL_PORT_START:-10000}
      TUNNEL_PORT_END: ${TUNNEL_PORT_END:-10100}
      BOOTSTRAP_AGENT_TOKEN: ${BOOTSTRAP_AGENT_TOKEN:?Set a long random agent token}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      DATABASE_URL: postgres://tunnel:${POSTGRES_PASSWORD}@postgres:5432/tunnel
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set a long random JWT signing secret}
    ports:
      - "${TUNNEL_PORT_START:-10000}-${TUNNEL_PORT_END:-10100}:${TUNNEL_PORT_START:-10000}-${TUNNEL_PORT_END:-10100}"
      - "${TUNNEL_PORT_START:-10000}-${TUNNEL_PORT_END:-10100}/udp:${TUNNEL_PORT_START:-10000}-${TUNNEL_PORT_END:-10100}/udp"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/18080; printf \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  admin:
    build:
      context: ./source
      dockerfile: deploy/Dockerfile.admin
    ports:
      - "${CONTROL_PORT:-18080}:18080"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tunnel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a long database password}
      POSTGRES_DB: tunnel
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tunnel -d tunnel"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:-tunnel-control_tunnel-control-postgres-data}
    external: true
  redis-data:
    name: ${REDIS_VOLUME_NAME:-tunnel-control_tunnel-control-redis-data}
    external: true
