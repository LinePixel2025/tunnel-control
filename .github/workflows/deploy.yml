name: Deploy to Server

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      deploy_subdir:
        description: 'Subdirectory under DEPLOY_DIR where the checkout lives (1Panel: source)'
        required: false
        default: source
        type: string
      compose_file:
        description: 'Compose file relative to the checkout'
        required: false
        default: deploy/compose.1panel.yaml
        type: string
      run_db_backup:
        description: 'Take a PostgreSQL dump before deploying'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  SSH_HOST: ${{ secrets.SSH_HOST }}
  SSH_PORT: ${{ secrets.SSH_PORT }}
  SSH_USER: ${{ secrets.SSH_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
  DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/opt/1panel/docker/compose/tunnel-control' }}
  DEPLOY_SUBDIR: ${{ github.event.inputs.deploy_subdir || secrets.DEPLOY_SUBDIR || 'source' }}
  COMPOSE_FILE: ${{ github.event.inputs.compose_file || secrets.COMPOSE_FILE || 'deploy/compose.1panel.yaml' }}
  ENV_FILE: ${{ secrets.ENV_FILE || '1panel.env' }}
  PROJECT_NAME: ${{ secrets.PROJECT_NAME || 'tunnel-control' }}
  RUN_DB_BACKUP: ${{ github.event.inputs.run_db_backup != 'false' }}
  RUN_NATIVE_BUILD: ${{ contains(github.event.inputs.compose_file || secrets.COMPOSE_FILE || 'deploy/compose.1panel.yaml', '1panel') }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if deployment secrets are not configured
        if: ${{ env.SSH_HOST == '' || env.SSH_USER == '' || env.SSH_PRIVATE_KEY == '' }}
        run: |
          echo "::error::SSH_HOST / SSH_USER / SSH_PRIVATE_KEY secrets are not set. See deploy/ci-deploy.md."
          exit 1

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Cache cargo build
        if: ${{ env.RUN_NATIVE_BUILD == 'true' }}
        uses: Swatinem/rust-cache@v2

      - name: Build tunnel-server binary
        if: ${{ env.RUN_NATIVE_BUILD == 'true' }}
        run: |
          # Same toolchain and glibc base as deploy/Dockerfile.server.prebuild.
          docker run --rm -v "$PWD":/src -w /src rust:1.97-bookworm \
            cargo build --release -j 4 -p tunnel-server

      - name: Trust server host key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            echo "WARNING: SSH_KNOWN_HOSTS not set; trusting host key on first connection (TOFU)."
            ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Sync repository to server
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          host="${SSH_HOST:?SSH_HOST is empty}"
          user="${SSH_USER:?SSH_USER is empty}"
          root="${DEPLOY_DIR:-/opt/1panel/docker/compose/tunnel-control}"
          sub="${DEPLOY_SUBDIR:-source}"
          target_dir="$root${sub:+/$sub}"
          # Deliberately no --delete: server-only files (1panel.env, deploy/backups,
          # deploy/bin/tunnel-server) must never be removed by CI.
          ssh -p "$port" "$user@$host" "mkdir -p '$target_dir'"
          rsync -azcO --exclude .git --exclude .env --exclude 'deploy/backups' \
            -e "ssh -p $port" ./ "$user@$host:$target_dir/"

      - name: Upload fresh tunnel-server binary
        if: ${{ env.RUN_NATIVE_BUILD == 'true' }}
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          host="${SSH_HOST:?SSH_HOST is empty}"
          user="${SSH_USER:?SSH_USER is empty}"
          root="${DEPLOY_DIR:-/opt/1panel/docker/compose/tunnel-control}"
          sub="${DEPLOY_SUBDIR:-source}"
          app_dir="$root${sub:+/$sub}"
          ssh -p "$port" "$user@$host" "mkdir -p '$app_dir/deploy/bin'"
          rsync -az -e "ssh -p $port" target/release/tunnel-server "$user@$host:$app_dir/deploy/bin/tunnel-server"

      - name: Run remote deploy
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          host="${SSH_HOST:?SSH_HOST is empty}"
          user="${SSH_USER:?SSH_USER is empty}"
          root="${DEPLOY_DIR:-/opt/1panel/docker/compose/tunnel-control}"
          sub="${DEPLOY_SUBDIR:-source}"
          compose_file="${COMPOSE_FILE:-deploy/compose.1panel.yaml}"
          env_file="${ENV_FILE:-1panel.env}"
          project="${PROJECT_NAME:-tunnel-control}"
          if [ "$RUN_DB_BACKUP" = "true" ]; then backup=1; else backup=0; fi
          ssh -p "$port" "$user@$host" \
            "DEPLOY_DIR='$root' DEPLOY_SUBDIR='$sub' COMPOSE_FILE='$compose_file' ENV_FILE='$env_file' PROJECT_NAME='$project' BACKUP_ENABLED='$backup' bash '$root/$sub/deploy/scripts/deploy-remote.sh'"
